openapi: 3.1.1

info:
  title: Egress Gateway Protocol
  version: 1.0.0
  description: |
    Governed HTTP exchange against immutable, owner-scoped pre-registered DestinationRevisions.
    Runtime requests never supply a raw origin; Tenant, ClientApplication, DestinationRevision
    and class are token-bound, and every redirect, DNS answer and connected address remains checked.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://egress-gateway.agent-platform.internal
    description: Registered Egress Gateway endpoint

security:
  - EgressMutualTLS: []
    EgressInvocationBearer: []

paths:
  /v1/http-exchanges:
    post:
      operationId: createGovernedHttpExchange
      summary: Execute one policy-bound HTTP request against a registered destination
      x-required-egress-token-operation: http_exchange
      x-operation-contract-id: urn:agent-platform:egress-http-request:v1
      x-operation-digest-profile: rfc8785-request-excluding-request-digest-v1
      x-max-encoded-body-bytes: 2097152
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/egress-http-request.schema.json
      responses:
        '200':
          description: Confirmed HTTP exchange response
          content:
            application/json:
              schema:
                $ref: ../schemas/egress-http-response.schema.json
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    EgressMutualTLS:
      type: mutualTLS
      description: Registered Agent Platform or Runtime workload identity.
    EgressInvocationBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-jws-header-contract-id: urn:agent-platform:egress-invocation-jws-header:v1
      x-jwt-claims-contract-id: urn:agent-platform:egress-invocation-token-claims:v1
      description: |
        Short-lived operation/Contract/Profile/Digest-bound token validated against
        urn:agent-platform:egress-invocation-token-claims:v1.

  responses:
    BadRequest:
      description: Malformed governed HTTP request.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    Unauthorized:
      description: Missing or invalid workload identity or Egress token.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    Forbidden:
      description: Destination, policy, budget, permission, scope or request digest mismatch.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    Conflict:
      description: Stale fencing token or request digest conflict.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    PayloadTooLarge:
      description: Encoded request exceeds the declared limit and was rejected before parsing.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    Unprocessable:
      description: Registered destination or HTTP operation violates policy.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    TooManyRequests:
      description: Egress concurrency or rate limit exceeded.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    BadGateway:
      description: Registered upstream returned an invalid or unavailable response.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    InternalError:
      description: Internal Egress Gateway error.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    Unavailable:
      description: Egress Gateway is temporarily unavailable.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
