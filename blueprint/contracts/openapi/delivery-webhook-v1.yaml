openapi: 3.1.1

info:
  title: Agent Business Callback
  version: 1.1.0
  description: |
    Receiver contract implemented by a registered Business Application callback. Delivery
    and settlement requests are sent at least once, authenticated independently and accepted
    idempotently by their immutable ID plus digest.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://business-callback.example.internal
    description: Pre-registered Business Application callback

tags:
  - name: Delivery
    description: Receive completed or terminal Agent deliveries.
  - name: Settlement
    description: Receive technical usage facts for Business-owned settlement and reconciliation.

security:
  - CallbackMutualTLS: []
  - CallbackMessageSignature: []

paths:
  /v1/agent-settlements:
    post:
      tags: [Settlement]
      operationId: receiveAgentSettlement
      summary: Receive a signed BusinessSettlementEnvelope
      x-max-encoded-body-bytes: 4194304
      description: |
        The embedded UsageReport is immutable technical evidence. The receiver owns price,
        balance and commercial settlement facts and must not mutate Platform TechnicalUsage.
      parameters:
        - name: Content-Digest
          in: header
          required: true
          schema:
            type: string
        - name: Signature-Input
          in: header
          required: false
          schema:
            type: string
        - name: Signature
          in: header
          required: false
          schema:
            type: string
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/business-settlement-envelope.schema.json
      responses:
        '204':
          description: Settlement request accepted idempotently
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/agent-deliveries:
    post:
      tags: [Delivery]
      operationId: receiveAgentDelivery
      summary: Receive a signed DeliveryPackage notification
      x-max-encoded-body-bytes: 1048576
      parameters:
        - name: Content-Digest
          in: header
          required: true
          schema:
            type: string
        - name: Signature-Input
          in: header
          required: false
          schema:
            type: string
        - name: Signature
          in: header
          required: false
          schema:
            type: string
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/delivery-webhook-envelope.schema.json
      responses:
        '204':
          description: Delivery accepted idempotently
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    CallbackMutualTLS:
      type: mutualTLS
      description: Pre-registered mutual TLS callback profile.
    CallbackMessageSignature:
      type: apiKey
      in: header
      name: Signature
      description: RFC 9421 HTTP Message Signature with a pre-registered key.

  responses:
    BadRequest:
      description: Malformed body or invalid digest.
      content:
        application/json:
          schema:
            $ref: ../schemas/standard-error.schema.json
    Unauthorized:
      description: Invalid mTLS identity, signature, timestamp or replay window.
      content:
        application/json:
          schema:
            $ref: ../schemas/standard-error.schema.json
    Conflict:
      description: The same immutable request ID was previously accepted with a different digest.
      content:
        application/json:
          schema:
            $ref: ../schemas/standard-error.schema.json
    Unprocessable:
      description: The signed request is valid but violates the registered Business contract.
      content:
        application/json:
          schema:
            $ref: ../schemas/standard-error.schema.json
    PayloadTooLarge:
      description: Encoded request body exceeds the operation limit and is rejected before JSON parsing.
      content:
        application/json:
          schema:
            $ref: ../schemas/standard-error.schema.json
    TooManyRequests:
      description: Receiver is applying backpressure.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: ../schemas/standard-error.schema.json
    InternalError:
      description: Receiver internal failure.
      content:
        application/json:
          schema:
            $ref: ../schemas/standard-error.schema.json
    Unavailable:
      description: Receiver temporarily unavailable.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: ../schemas/standard-error.schema.json
