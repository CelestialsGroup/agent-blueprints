components:
  securitySchemes:
    ServiceOAuth:
      type: oauth2
      x-jws-header-contract-id: urn:agent-platform:service-access-token-jws-header:v1
      x-jwt-claims-contract-id: urn:agent-platform:service-access-token-claims:v1
      description: |
        OAuth2 Client Credentials. Production access tokens follow RFC 9068,
        are audience-restricted, and use an approved sender-constraining profile
        such as mTLS or DPoP.
      flows:
        clientCredentials:
          tokenUrl: https://identity.agent-platform.internal/oauth2/token
          scopes:
            work:create: Submit WorkOrders.
            work:read: Read WorkOrders and events.
            work:cancel: Cancel WorkOrders.
            work:control: Pause, resume, approve and open Runtime sessions.
            authorization:revoke: Revoke a previously signed CommercialAuthorization.
            session:create: Create browser WorkSessions.
            session:delegate: Create an explicitly audited delegated WorkSession.
            artifact:read: Read Artifacts.
            artifact:write: Ingest, edit and convert Artifacts.
            provider:admin: Administer Plugins and Providers.
            conversation:create: Create Conversations and their Workspaces.
            conversation:read: Read Conversations and messages.
            catalog:read: Discover tenant-visible Experiences and immutable revisions.
    WorkSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-agent_session
      x-jws-header-contract-id: urn:agent-platform:work-session-jws-header:v1
      x-jwt-claims-contract-id: urn:agent-platform:work-session-claims:v1
      description: HttpOnly Secure browser session cookie bound to one Conversation and optionally narrowed to one WorkOrder.
    WorkSessionBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-jws-header-contract-id: urn:agent-platform:work-session-jws-header:v1
      x-jwt-claims-contract-id: urn:agent-platform:work-session-claims:v1
      description: In-memory token profile for trusted headless SDKs; never persist in browser storage.

  parameters:
    CommercialAuthorizationId:
      name: commercial_authorization_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key scoped by Tenant, ClientApplication, operation and key digest.
      schema:
        type: string
        minLength: 16
