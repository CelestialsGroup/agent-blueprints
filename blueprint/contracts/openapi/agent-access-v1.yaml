openapi: 3.1.1

info:
  title: Agent Access API
  version: 1.1.0
  description: |
    Trusted business backends submit asynchronous WorkOrders. Browser users access
    a standalone Agent Workbench through a short-lived, one-time WorkSession exchange.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://agent-api.agent-platform.internal
    description: Production

tags:
  - name: WorkOrders
    description: Submit and control asynchronous work.
  - name: WorkSessions
    description: Create and exchange short-lived browser sessions.
  - name: Conversations
    description: Multi-turn Agent conversations, messages, branches and turns.
  - name: Catalog
    description: Entitlement-filtered Scenario and Experience discovery.
  - name: Recordings
    description: Historical RuntimeSession playback manifests.
  - name: Artifacts
    description: Ingest, read, edit and convert Artifacts.
  - name: BusinessControl
    description: Accept immutable Business-owned authorization revocations.

security:
  - ServiceOAuth:
      - work:read

paths:
  /v1/commercial-authorizations/{commercial_authorization_id}/revocations:
    post:
      tags: [BusinessControl]
      operationId: revokeCommercialAuthorization
      x-path-body-bindings:
        - path_parameter: commercial_authorization_id
          body_json_pointer: /commercial_authorization_id
      summary: Record an immutable Business authorization revocation
      description: |
        Only a sender-constrained, allowlisted Business workload may submit this
        request. client_app_id and Platform tenant_id are derived server-side from
        the authenticated client and external_tenant_id. The path ID, stored
        CommercialAuthorization ID/digest and request body must match. Acceptance
        atomically records the revocation receipt and fan-out intent; affected active
        runs immediately stop receiving new execution/Gateway authorization and receive
        newly fenced Platform-owned SystemSafetyControl Cancel records without creating
        a new Business Grant or allowing any execution expansion. Cancellation remains
        intent until Provider evidence confirms the terminal outcome.
      x-max-encoded-body-bytes: 65536
      security:
        - ServiceOAuth:
            - authorization:revoke
      parameters:
        - $ref: '#/components/parameters/CommercialAuthorizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/commercial-authorization-revocation.schema.json
      responses:
        '202':
          description: Revocation durably accepted for idempotent safety-control fan-out
          content:
            application/json:
              schema:
                $ref: ../schemas/commercial-authorization-revocation-accepted.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifact-ingest-sessions:
    post:
      tags: [Artifacts]
      operationId: createArtifactIngestSession
      summary: Create a constrained input Artifact upload session
      description: The caller supplies identity, commercial authorization and upload intent only. The Platform allocates the session and derives its PolicyDecision, ExecutionBudget and EffectivePermissions before returning upload capability; caller-supplied admission facts are rejected.
      x-max-encoded-body-bytes: 65536
      security:
        - ServiceOAuth:
            - artifact:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/artifact-ingest-request.schema.json
      responses:
        '201':
          description: Upload session created
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: ../schemas/artifact-ingest-response.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifact-ingest-sessions/{ingest_session_id}:
    parameters:
      - name: ingest_session_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Traceparent'
    get:
      tags: [Artifacts]
      operationId: getArtifactIngestSession
      summary: Read durable upload, scan and Platform finalization status
      description: Upload storage state is not authoritative; this response is the tenant and principal authorized Platform aggregate.
      security:
        - ServiceOAuth:
            - artifact:read
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      responses:
        '200':
          description: Current Artifact ingest state
          content:
            application/json:
              schema:
                $ref: ../schemas/artifact-ingest-session.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/artifact-ingest-sessions/{ingest_session_id}/confirm:
    parameters:
      - name: ingest_session_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Artifacts]
      operationId: confirmArtifactIngestUpload
      x-path-body-bindings:
        - path_parameter: ingest_session_id
          body_json_pointer: /ingest_session_id
      summary: Confirm uploaded bytes and enqueue governed scanning
      description: Confirmation is idempotent and never finalizes ArtifactVersion. Scan and finalization remain durable Platform-owned transitions.
      x-max-encoded-body-bytes: 65536
      security:
        - ServiceOAuth:
            - artifact:write
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/artifact-ingest-confirm-request.schema.json
      responses:
        '202':
          description: Upload confirmed and scan enqueued or previously accepted result replayed
          content:
            application/json:
              schema:
                $ref: ../schemas/artifact-ingest-session.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/work-orders:
    post:
      tags: [WorkOrders]
      operationId: createWorkOrder
      summary: Submit an asynchronous WorkOrder
      x-max-encoded-body-bytes: 4194304
      description: |
        client_app_id is derived from the sender-constrained Service Access Token.
        The single-use ExecutionGrant is consumed atomically with WorkOrder creation.
        ExecutionGrant request_contract_id MUST identify work-order-request:v1. Its
        request digest covers the complete JSON request except execution_grant.
      security:
        - ServiceOAuth:
            - work:create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/work-order-request.schema.json
      responses:
        '202':
          description: WorkOrder accepted
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: ../schemas/work-order-accepted.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/work-orders/{work_order_id}:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
      - $ref: '#/components/parameters/Traceparent'
    get:
      tags: [WorkOrders]
      operationId: getWorkOrder
      summary: Get current WorkOrder state
      x-required-work-session-scopes: [work:read]
      security:
        - ServiceOAuth:
            - work:read
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      responses:
        '200':
          description: Current WorkOrder state
          content:
            application/json:
              schema:
                $ref: ../schemas/work-order-state.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/work-orders/{work_order_id}/control:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [WorkOrders]
      operationId: controlWorkOrder
      x-path-body-bindings:
        - path_parameter: work_order_id
          body_json_pointer: /work_order_id
      summary: Submit the only authorized user control command for an existing WorkOrder
      description: |
        This is the only user authority path for append_input, interrupt, pause, resume,
        cancel and approval_decision. It never creates a Turn or successor WorkOrder.
        The Platform first persists the immutable WorkOrderControlRequest and consumes a
        fresh single-use ExecutionGrant, then emits Runtime commands that must reference
        control_request_id. Message and active-work CAS remain independent from Workspace CAS.
      x-required-work-session-scopes: [work:control]
      x-cookie-csrf-required: true
      x-max-encoded-body-bytes: 1048576
      security:
        - ServiceOAuth:
            - work:control
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/work-order-control-request.schema.json
      responses:
        '202':
          description: Control request durably accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/work-order-state.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/work-orders/{work_order_id}/events:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
      - $ref: '#/components/parameters/Traceparent'
    get:
      tags: [WorkOrders]
      operationId: streamWorkOrderEvents
      summary: Stream durable WorkOrder events
      description: |
        The SSE frame ID is work_sequence. Clients resume with Last-Event-ID or
        after_work_sequence. The server sends heartbeat comments at least every
        15 seconds. A cursor older than retained history returns 410.
      x-required-work-session-scopes: [event:subscribe]
      security:
        - ServiceOAuth:
            - work:read
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      parameters:
        - name: after_work_sequence
          in: query
          required: false
          description: Resume strictly after this WorkOrder sequence.
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: SSE cursor; ignored when after_work_sequence is present.
          schema:
            type: string
      responses:
        '200':
          description: Durable event stream
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                : heartbeat

                id: 152
                event: artifact.version.created
                data: {"schema_version":2,"work_sequence":152}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Requested cursor is older than retained event history
          content:
            application/json:
              schema:
                $ref: ../schemas/event-cursor-expired.schema.json
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/work-orders/{work_order_id}/sessions:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
      - $ref: '#/components/parameters/Traceparent'
    post:
      tags: [WorkSessions]
      operationId: createWorkSession
      summary: Create a one-time WorkSession exchange token
      x-max-encoded-body-bytes: 262144
      security:
        - ServiceOAuth:
            - session:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/work-session-request.schema.json
      responses:
        '201':
          description: One-time exchange material created
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: ../schemas/work-session-response.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/work-sessions/exchange:
    post:
      tags: [WorkSessions]
      operationId: exchangeWorkSession
      summary: Exchange a one-time token for an HttpOnly Workbench session cookie
      x-max-encoded-body-bytes: 65536
      security: []
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/work-session-exchange-request.schema.json
      responses:
        '200':
          description: Browser session established
          headers:
            Set-Cookie:
              description: |
                `__Host-agent_session` HttpOnly Secure SameSite cookie. The exact
                SameSite policy is selected by the deployment profile.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: ../schemas/work-session-exchange-response.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/work-orders/{work_order_id}/approvals:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
      - $ref: '#/components/parameters/Traceparent'
    get:
      tags: [WorkOrders]
      operationId: listWorkOrderApprovals
      summary: List approvals visible to the current principal
      x-required-work-session-scopes: [approval:read]
      security:
        - ServiceOAuth:
            - work:read
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      responses:
        '200':
          description: Approval list
          content:
            application/json:
              schema:
                $ref: ../schemas/approval-list.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/work-orders/{work_order_id}/runtime-sessions:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [WorkSessions]
      operationId: createRuntimeSession
      summary: Create a short-lived Runtime Gateway session
      x-max-encoded-body-bytes: 65536
      x-required-work-session-scopes: [runtime:view]
      x-cookie-csrf-required: true
      security:
        - ServiceOAuth:
            - work:control
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/runtime-session-request.schema.json
      responses:
        '201':
          description: Runtime Session created
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime-session-response.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifacts/{artifact_id}:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/Traceparent'
    get:
      tags: [Artifacts]
      operationId: getArtifact
      summary: Read Artifact metadata
      x-required-work-session-scopes: [artifact:read]
      security:
        - ServiceOAuth:
            - artifact:read
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      responses:
        '200':
          description: Artifact metadata
          content:
            application/json:
              schema:
                $ref: ../schemas/artifact-metadata.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/artifacts/{artifact_id}/versions/{version_id}:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/VersionId'
      - $ref: '#/components/parameters/Traceparent'
    get:
      tags: [Artifacts]
      operationId: getArtifactVersion
      summary: Read immutable ArtifactVersion metadata
      x-required-work-session-scopes: [artifact:read]
      security:
        - ServiceOAuth:
            - artifact:read
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      responses:
        '200':
          description: ArtifactVersion metadata
          content:
            application/json:
              schema:
                $ref: ../schemas/artifact-version.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'



  /v1/artifacts/{artifact_id}/versions/{version_id}/access:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/VersionId'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [Artifacts]
      operationId: createArtifactAccess
      summary: Create short-lived access to immutable Artifact content
      x-max-encoded-body-bytes: 65536
      x-required-work-session-scopes: [artifact:read]
      x-cookie-csrf-required: true
      security:
        - ServiceOAuth:
            - artifact:read
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/artifact-access-request.schema.json
      responses:
        '201':
          description: Short-lived Artifact access created
          content:
            application/json:
              schema:
                $ref: ../schemas/artifact-access-response.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/artifacts/{artifact_id}/preview-sessions:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [Artifacts]
      operationId: createArtifactPreviewSession
      x-path-body-bindings:
        - path_parameter: artifact_id
          body_json_pointer: /operation_context/artifact_id
      summary: Create a short-lived isolated Artifact preview
      description: The caller supplies the Artifact, requested Capability and commercial inputs. The Platform allocates ArtifactOperation and derives Policy, Budget, Permissions, Gateway, ProviderResolution and Invocation bindings.
      x-max-encoded-body-bytes: 262144
      x-required-work-session-scopes: [artifact:read]
      x-cookie-csrf-required: true
      security:
        - ServiceOAuth:
            - artifact:read
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/preview-session-request.schema.json
      responses:
        '201':
          description: Preview Session created
          content:
            application/json:
              schema:
                $ref: ../schemas/preview-session.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifacts/{artifact_id}/edit-sessions:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [Artifacts]
      operationId: createArtifactEditSession
      x-path-body-bindings:
        - path_parameter: artifact_id
          body_json_pointer: /operation_context/artifact_id
      summary: Create an Artifact EditSession
      description: The caller supplies the Artifact, requested Capability and commercial inputs. The Platform allocates ArtifactOperation and derives Policy, Budget, Permissions, Gateway, ProviderResolution and Invocation bindings.
      x-max-encoded-body-bytes: 262144
      x-required-work-session-scopes: [artifact:edit]
      x-cookie-csrf-required: true
      security:
        - ServiceOAuth:
            - artifact:write
        - WorkSessionCookie: []
        - WorkSessionBearer: []
      requestBody:
