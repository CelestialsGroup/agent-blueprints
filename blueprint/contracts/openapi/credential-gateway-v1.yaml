openapi: 3.1.1

info:
  title: Credential Gateway Protocol
  version: 1.0.0
  description: |
    Fail-closed Secret Broker mediation for one exact WorkOrder or ArtifactOperation action.
    The Gateway releases only a workload-bound, single-operation delivery handle and never
    makes Secret material part of Platform state, Events, logs, Recording or Temporal History.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://credential-gateway.agent-platform.internal
    description: Registered Credential Gateway endpoint

security:
  - CredentialMutualTLS: []
    CredentialOperationBearer: []

paths:
  /v1/credential-access:
    post:
      operationId: accessCredentialForOperation
      summary: Consume one SecretGrant and return one non-cacheable delivery handle
      x-required-credential-token-operation: credential_access
      x-operation-contract-id: urn:agent-platform:credential-access-request:v1
      x-operation-digest-profile: rfc8785-request-excluding-request-digest-v1
      x-max-encoded-body-bytes: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/credential-access-request.schema.json
      responses:
        '200':
          description: SecretGrant consumed and audited before one-operation delivery
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: ../schemas/credential-delivery.schema.json
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    CredentialMutualTLS:
      type: mutualTLS
      description: Exact registered Provider or Sandbox workload identity bound by SecretGrant.
    CredentialOperationBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-jws-header-contract-id: urn:agent-platform:credential-operation-jws-header:v1
      x-jwt-claims-contract-id: urn:agent-platform:credential-operation-token-claims:v1
      description: Short-lived, sender-constrained, single-operation Credential Gateway token.

  responses:
    BadRequest:
      description: Malformed credential access request.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    Unauthorized:
      description: Missing or invalid workload identity, JWS header or operation token.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    Forbidden:
      description: Tenant, Principal, execution scope, Provider, target, purpose, SecretGrant or digest mismatch.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    Conflict:
      description: SecretGrant already consumed or request digest conflicts with the recorded operation.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    Gone:
      description: SecretGrant expired or was revoked before consumption.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    PayloadTooLarge:
      description: Encoded request exceeded the operation limit and was rejected before parsing.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    Unprocessable:
      description: Request is well formed but cannot be safely mediated for the declared purpose.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    InternalError:
      description: Credential Gateway failed before material delivery; no grant is treated as successfully consumed without an auditable outcome.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
    Unavailable:
      description: Gateway, audit sink or backing secret authority is unavailable; access fails closed.
      content: { application/json: { schema: { $ref: ../schemas/standard-error.schema.json } } }
