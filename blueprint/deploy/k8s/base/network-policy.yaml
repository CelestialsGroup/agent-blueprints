apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-control-plane
  namespace: agent-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-runtime
  namespace: agent-runtime
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-dns
  namespace: agent-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runtime-dns
  namespace: agent-runtime
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-gateway-to-agent-api
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app: agent-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              agent-platform.io/public-gateway: "true"
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-gateway-to-runtime-gateway
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app: runtime-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              agent-platform.io/public-gateway: "true"
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-dependencies
  namespace: agent-platform
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [agent-api, agent-worker, runtime-gateway]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              agent-platform.io/control-plane-dependency: "true"
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 7233}
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runtime-gateway-to-sandbox
  namespace: agent-runtime
spec:
  podSelector:
    matchLabels:
      agent-platform.io/workload: sandbox
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-platform
          podSelector:
            matchLabels:
              app: runtime-gateway
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 5900}
        - {protocol: TCP, port: 9222}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runtime-to-egress-gateway
  namespace: agent-runtime
spec:
  podSelector:
    matchLabels:
      agent-platform.io/workload: sandbox
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              agent-platform.io/egress-gateway: "true"
      ports:
        - {protocol: TCP, port: 8443}
