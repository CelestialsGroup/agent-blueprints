apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform
  labels:
    kubernetes.io/metadata.name: agent-platform
    agent-platform.io/trust-zone: control-plane
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-runtime
  labels:
    kubernetes.io/metadata.name: agent-runtime
    agent-platform.io/trust-zone: sandbox-runtime
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
