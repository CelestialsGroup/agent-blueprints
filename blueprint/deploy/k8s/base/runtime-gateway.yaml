apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-gateway
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runtime-gateway
  template:
    metadata:
      labels:
        app: runtime-gateway
    spec:
      serviceAccountName: runtime-gateway
      terminationGracePeriodSeconds: 45
      containers:
      - name: runtime-gateway
        image: example.invalid/runtime-gateway@sha256:replace-me
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          failureThreshold: 30
          periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: runtime-gateway
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: runtime-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: runtime-gateway
  namespace: agent-platform
spec:
  selector:
    app: runtime-gateway
  ports:
  - name: http
    port: 80
    targetPort: http
