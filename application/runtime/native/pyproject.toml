[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "agent-native-runtime"
version = "0.1.0"
description = "Native Agent Runtime Provider for the Agent project"
requires-python = ">=3.13,<3.15"
dependencies = [
  "cryptography==49.0.0",
  "jsonschema==4.26.0",
  "PyJWT==2.13.0",
  "rfc8785==0.1.4",
  "typing-extensions==4.15.0",
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "ruff==0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_native_runtime"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["src/agent_native_runtime/generated"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src/agent_native_runtime", "test"]
exclude = ["src/agent_native_runtime/generated/"]

[[tool.mypy.overrides]]
module = ["agent_native_runtime.generated.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
