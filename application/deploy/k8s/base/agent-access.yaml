apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-access
  namespace: agent
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: agent-access
  template:
    metadata:
      labels:
        app: agent-access
    spec:
      serviceAccountName: agent-access
      terminationGracePeriodSeconds: 45
      containers:
      - name: agent-access
        image: example.invalid/agent-access@sha256:replace-me
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: agent-access
---
apiVersion: v1
kind: Service
metadata:
  name: agent-access
  namespace: agent
spec:
  selector:
    app: agent-access
  ports:
  - name: http
    port: 80
    targetPort: http
