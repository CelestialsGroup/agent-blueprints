apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-control-plane
  namespace: agent-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-dns
  namespace: agent-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-gateway-to-agent-access
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app: agent-access
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              agent-platform.io/public-gateway: "true"
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-dependencies
  namespace: agent-platform
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [agent-access]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              agent-platform.io/control-plane-dependency: "true"
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 7233}
        - {protocol: TCP, port: 443}
