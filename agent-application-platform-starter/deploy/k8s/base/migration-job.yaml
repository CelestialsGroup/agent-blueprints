apiVersion: batch/v1
kind: Job
metadata:
  name: agent-db-migration
  namespace: agent-platform
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: agent-migration
      containers:
        - name: migration
          image: example.invalid/agent-api@sha256:replace-me
          args: ["migrate", "up"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
