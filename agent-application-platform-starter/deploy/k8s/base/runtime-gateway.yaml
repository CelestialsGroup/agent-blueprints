apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-gateway
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runtime-gateway
  template:
    metadata:
      labels:
        app: runtime-gateway
    spec:
      serviceAccountName: runtime-gateway
      terminationGracePeriodSeconds: 45
      containers:
        - name: runtime-gateway
          image: example.invalid/runtime-gateway@sha256:replace-me
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: runtime-gateway
  namespace: agent-platform
spec:
  selector:
    app: runtime-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
